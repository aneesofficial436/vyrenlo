<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Web app delivery lifecycle from discovery to production">
  <rect width="800" height="320" fill="#F5F3EF"/>
  <rect x="32" y="120" width="736" height="4" rx="2" fill="#E6E0D6"/>
  <circle cx="100" cy="122" r="28" fill="#102A50"/>
  <text x="100" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="700">1</text>
  <text x="100" y="72" text-anchor="middle" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Discover</text>
  <text x="100" y="188" text-anchor="middle" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">Scope &amp; journeys</text>
  <circle cx="260" cy="122" r="28" fill="#102A50"/>
  <text x="260" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="700">2</text>
  <text x="260" y="72" text-anchor="middle" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Design</text>
  <text x="260" y="188" text-anchor="middle" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">UX &amp; architecture</text>
  <circle cx="420" cy="122" r="28" fill="#0C6E68"/>
  <text x="420" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="700">3</text>
  <text x="420" y="72" text-anchor="middle" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Build</text>
  <text x="420" y="188" text-anchor="middle" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">Weekly previews</text>
  <circle cx="580" cy="122" r="28" fill="#102A50"/>
  <text x="580" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="700">4</text>
  <text x="580" y="72" text-anchor="middle" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Ship</text>
  <text x="580" y="188" text-anchor="middle" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">CI/CD &amp; monitoring</text>
  <circle cx="740" cy="122" r="28" fill="#102A50"/>
  <text x="740" y="128" text-anchor="middle" fill="#FFFFFF" font-family="system-ui,sans-serif" font-size="13" font-weight="700">5</text>
  <text x="740" y="72" text-anchor="middle" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">Improve</text>
  <text x="740" y="188" text-anchor="middle" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">Usage &amp; backlog</text>
  <rect x="48" y="228" width="704" height="64" rx="12" fill="#FFFFFF" stroke="#E6E0D6"/>
  <text x="72" y="256" fill="#102A50" font-family="system-ui,sans-serif" font-size="12" font-weight="600">You stay in control</text>
  <text x="72" y="276" fill="#5C6A7E" font-family="system-ui,sans-serif" font-size="11">Written milestones, preview links each week, approval before production deploys.</text>
</svg>
