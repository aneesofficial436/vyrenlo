  <text x="670" y="240" fill="#5C6A7E" font-size="15" font-family="system-ui,sans-serif">- Steps, pages, hooks, configs</text>
  <text x="670" y="275" fill="#5C6A7E" font-size="15" font-family="system-ui,sans-serif">- ElementResolver vocabulary</text>
  <text x="670" y="310" fill="#5C6A7E" font-size="15" font-family="system-ui,sans-serif">- Release-branch checkout in CI</text>
  <text x="600" y="360" text-anchor="middle" fill="#5C6A7E" font-size="28" font-family="system-ui,sans-serif">+</text>
  <text x="600" y="560" text-anchor="middle" fill="#0C6E68" font-size="14" font-weight="600" font-family="system-ui,sans-serif">QA velocity decoupled from locator maintenance</text>
